      terms: [{ start: "2025-05-24", end: null }]
    },
  ];

  const chartWrapper = document.getElementById('chart-wrapper');
  chartWrapper.style.height = (people.length * 40 + 100) + 'px';

  const toDate = (str) => {
    if (!str || str === "presente") {
      return luxon.DateTime.now().toJSDate();
    }
    return luxon.DateTime.fromISO(str).toJSDate();
  }

  // AQUÍ PASAMOS EL RESUMEN A LOS DATOS QUE DIBUJA CHART.JS
  const lifespanData = people.map(p => ({
    x: [toDate(p.life.start), toDate(p.life.end)],
    y: p.name,
    resumen: p.resumen || "Sin información."
  }));

  const termsData = people.flatMap(p => p.terms.map(t => ({
    x: [toDate(t.start), toDate(t.end)],
    y: p.name,
    resumen: p.resumen || "Sin información."
  })));

  const ctx = document.getElementById('timeline').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      datasets: [
        {
          label: 'Periodo de Vida',
          data: lifespanData,
          backgroundColor: 'rgba(0, 0, 0, 0.05)',
          borderColor: 'rgba(0, 0, 0, 0.1)',
          borderWidth: 1,
          barThickness: 15
        },
        {
          label: 'Presidencia',
          data: termsData,
          backgroundColor: '#0056b3',
          borderColor: 'lightblue',
          borderWidth: 1,
          barThickness: 15
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: 'time',
          time: {
            unit: 'year',
            displayFormats: { year: 'yyyy' }
          },
          min: toDate("1800-01-01"),
          max: toDate("2027-01-01"),
          ticks: {
            stepSize: 5,
            autoSkip: false
          },
          title: { display: true, text: 'Cronología (Años)' }
        },
        y: {
          type: 'category',
          labels: people.map(p => p.name),
          ticks:{
            autoSkip: false
          }
        }
      },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          // MODIFICAMOS EL TOOLTIP AQUÍ
          callbacks: {
            label: (ctx) => {
              const start = luxon.DateTime.fromJSDate(ctx.raw.x[0]).toFormat('yyyy');
              const end = luxon.DateTime.fromJSDate(ctx.raw.x[1]).toFormat('yyyy');
              
              // Al devolver un arreglo, Chart.js dibuja cada elemento en una línea distinta
              return [
                `${ctx.dataset.label}: ${start} -${end}`,
                ``, // Línea vacía para separar
                `Resumen: ${ctx.raw.resumen}`
              ];
            }
          }
        }
      }
    }
  });
  </script>
